# Builds the web app (campaigniq/web) and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# Backend: the site connects to the Render API https://mahadhan-campaigniq-api.onrender.com/api by default.
#   To use another backend set Settings -> Secrets and variables -> Actions -> Variables -> VITE_API_URL.
#   If the backend is unreachable the site still works: dashboards use built-in data, the copilot calls the LLM directly.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows "Run workflow" from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campaigniq
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            campaigniq/package-lock.json
            campaigniq-v3/package-lock.json

      - name: Install web app dependencies
        run: npm ci --workspace web

      - name: Build static site
        run: npm run build --workspace web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://mahadhan-campaigniq-api.onrender.com/api' }}

      - name: Check the build contains the page and the map data
        run: |
          test -s web/dist/index.html
          test -s web/dist/geo/india-districts.topo.json
          test -s web/dist/geo/jalna-talukas.topo.json
          echo "Backend: ${VITE_API_URL:-none (static demo)}"
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://mahadhan-campaigniq-api.onrender.com/api' }}

      # CampaignIQ v3 (Business Head first) is served at /v3/ next to the existing app at /.
      - name: Install v3 dependencies
        run: npm ci
        working-directory: campaigniq-v3

      - name: Test, check and build v3
        run: |
          npm test
          npm run hygiene
          npm run build
        working-directory: campaigniq-v3

      - name: Add v3 to the site under /v3/
        run: |
          mkdir -p web/dist/v3
          cp -r ../campaigniq-v3/dist/. web/dist/v3/
          test -s web/dist/v3/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: campaigniq/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
